services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vision_board
      POSTGRES_USER: vision_board
      POSTGRES_PASSWORD: local_development_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vision_board -d vision_board']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
